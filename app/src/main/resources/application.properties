spring.application.name=selfapp-lite
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:selfapplite}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:selfuser}
spring.datasource.password=${DB_PASS:selfpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.rabbitmq.host=${MQ_HOST:localhost}
spring.rabbitmq.port=${MQ_PORT:5672}
spring.rabbitmq.username=${MQ_USER:guest}
spring.rabbitmq.password=${MQ_PASS:guest}

# Actuator: health for Docker's healthcheck, prometheus for observability-selfapp
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
# Histogram buckets for HTTP requests, so Prometheus can calculate p95/p99 latency
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Adds application="selfapp-lite" to every metric, to tell apps apart in Grafana
management.metrics.tags.application=${spring.application.name}
