<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login — Selfapp Lite</title>
    <style>
        body { font-family: sans-serif; max-width: 360px; margin: 80px auto; color: #1a1510; }
        h1 { border-bottom: 2px solid #1a1510; padding-bottom: 8px; font-size: 22px; }
        form { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        input { padding: 8px 10px; border: 1px solid #ccc; }
        button { padding: 8px; background: #1a6b3a; color: white; border: none; cursor: pointer; }
        button:hover { background: #145c30; }
        .error { color: #c0392b; font-size: 13px; }
        .hint { color: #9a8f82; font-size: 12px; margin-top: 16px; line-height: 1.5; }
    </style>
</head>
<body>
    <h1>Selfapp Lite — Login</h1>

    <p class="error" th:if="${param.error}">Incorrect username or password.</p>

    <form th:action="@{/login}" method="post">
        <input type="text" name="username" placeholder="Username" required autofocus>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p class="hint">
        Demo users:<br>
        <strong>admin_self / admin_self</strong> (ADMIN)<br>
        <strong>test_self / test_self</strong> (USER)
    </p>
</body>
</html>
