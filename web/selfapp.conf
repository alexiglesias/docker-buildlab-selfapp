upstream selfapp {
    server selfapp:8080;
}

server {
    listen 80;
    server_name localhost;

    # Log to the container's output so `docker logs` and Loki can see it
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Sent with every proxied request (inherited by all locations below)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://selfapp;
    }

    # Health status (UP/DOWN only, no details) stays public
    location = /actuator/health {
        proxy_pass http://selfapp;
    }

    # The rest of Actuator, e.g. /actuator/prometheus, is for Prometheus on
    # the internal Docker network only - never served on port 80
    location /actuator {
        return 404;
    }
}
